plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fourtwo.hookintent'
    compileSdk 33

    defaultConfig {
        applicationId "com.fourtwo.hookintent"
        minSdk 24
        versionCode 10702
        versionName "1.7.2"

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        debug {
            versionNameSuffix "-dev.8"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
            res.srcDirs = ['src/main/res']

            assets.srcDirs = [layout.buildDirectory.dir('generated/appAssets').get().asFile]
        }
    }
    buildFeatures {
        aidl true
    }
}

dependencies {
    compileOnly project(path: ':hiddenapi')

    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:4.3"

    // Root提权
    def libsu_version = '6.0.0'
    implementation "com.github.topjohnwu.libsu:core:${libsu_version}"
    implementation "com.github.topjohnwu.libsu:service:${libsu_version}"

    // ShiZuKu
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:${shizuku_version}"
    implementation "dev.rikka.shizuku:provider:${shizuku_version}"

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.2'
    implementation 'androidx.navigation:navigation-ui:2.5.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation files('libs/XposedBridgeAPI-89.jar')
    testImplementation 'org.robolectric:robolectric:4.10.3'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
//    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.android.tools.build:apksig:8.0.0'

    // UI控件
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    compileOnly fileTree(include: ['.jar'], dir: 'libs')
    compileOnly files('libs/XposedBridgeAPI-89.jar')
}
// Every app variant embeds the template built from the same checkout.
def prepareAppAssets = tasks.register('prepareAppAssets') {
    dependsOn ':blocker_template:assembleRelease'
    inputs.dir('src/main/assets')
    outputs.dir(layout.buildDirectory.dir('generated/appAssets'))
}
// Android Studio may sign and redirect every application module's APK. Consume
// AGP's actual release artifact instead of assuming an unsigned name or location.
def templateProject = project(':blocker_template')
templateProject.plugins.withId('com.android.application') {
    def components = templateProject.extensions.getByName('androidComponents')
    components.onVariants(components.selector().withBuildType('release')) { variant ->
        def apkDirectory = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE)
        def loader = variant.artifacts.getBuiltArtifactsLoader()
        prepareAppAssets.configure {
            inputs.dir(apkDirectory).withPropertyName('blockerReleaseApks')
            doLast {
                def built = loader.load(apkDirectory.get())
                if (built == null || built.elements.size() != 1)
                    throw new GradleException('Expected one blocker template release APK in ' + apkDirectory.get().asFile)
                def apk = new File(built.elements.first().outputFile)
                if (!apk.isFile()) throw new GradleException('Blocker template APK not found: ' + apk)
                project.sync {
                    into layout.buildDirectory.dir('generated/appAssets')
                    from('src/main/assets') { exclude 'blocker/blocker_template.apk' }
                    from(apk) {
                        into 'blocker'
                        rename { 'blocker_template.apk' }
                    }
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn prepareAppAssets }
