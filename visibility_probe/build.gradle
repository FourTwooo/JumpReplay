plugins { id 'com.android.application' }
android {
    namespace 'com.fourtwo.hookintent.visibilityprobe'
    compileSdk 33
    defaultConfig {
        applicationId 'com.fourtwo.hookintent.visibilityprobe'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        visibilityNew {
            initWith debug
            applicationIdSuffix '.new'
        }
    }
}
