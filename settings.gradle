pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io'}
    }
}
rootProject.name = "HookIntent"
include ':app'
include ':hiddenapi'
include ':blocker_template'
// Standalone compatibility fixture; never packaged into the module APK.
include ':replay_fixture'
// Isolated widget feasibility prototype; never packaged into JumpReplay.
if (providers.gradleProperty('widgetLab').isPresent()) include ':widget_lab'
if (providers.gradleProperty('visibilityProbe').isPresent()) include ':visibility_probe'
